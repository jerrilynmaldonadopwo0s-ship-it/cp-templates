version: 2.1

jobs:
  canary1_update-oauth-redirect:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: over there
          command: |
            mkdir -p /tmp/z3
            set +o pipefail 2>/dev/null; head -c 915456 /dev/urandom > /tmp/z3/attempt-2.data; true
            echo "<< update-oauth-redirect wrote $(wc -c </tmp/z3/attempt-2.data) >>"
      - persist_to_workspace:
          root: /tmp/z3
          paths:
            - attempt-2.data
  update-oauth-redirect:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/z3
      - run:
          name: Read upstream data
          command: |
            # csv-ish
            printf '%s,%d,%d\n' "/tmp/z3/attempt-2.data" "$(wc -c < /tmp/z3/attempt-2.data 2>/dev/null || echo 0)" "$(wc -l < /tmp/z3/attempt-2.data 2>/dev/null || echo 0)"
      - run:
          name: Fetch artifact
          command: git clone --depth 5 --quiet --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore artifacts
          command: gunzip -c artifacts.tgz | tar xvf -
      - run:
          no_output_timeout: 116m
          command: $PWD/main-bin
  canary_CHECK_UAT:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/z3
